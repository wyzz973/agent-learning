[project]
name = "agent-learning"
version = "0.1.0"
description = "以 Jupyter 专题任务学习 LangChain、LangGraph 与 Deep Research"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langsmith>=0.4",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "langchain-deepseek>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "fastembed>=0.8,<1",
    "deepagents>=0.7.13,<0.8",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
notebooks = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.4,<5",
    "langchain-mcp-adapters>=0.1,<1",
    "mcp>=1.20,<2",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F 基础；I 导入排序；UP 语法现代化；B 常见 bug；ASYNC 异步误用
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Notebook 中的示范、导入和本人练习分格编写。
"modules/**/*.ipynb" = ["F401", "F841", "E402", "B018"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "instructor/tests",
    "tests",
    "modules/05-deep-research/tests",
    "modules/06-research-system/tests",
]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["instructor"]
strict = true
ignore_missing_imports = true
untyped_calls_exclude = ["nbformat"]

[tool.uv]
package = false
default-groups = ["dev", "notebooks"]
