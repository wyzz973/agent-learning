<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="452" viewBox="0 0 1050 452" role="img"><title>M05 模块业务架构</title><desc>可信身份、数据与执行边界分层；概念设计不是当前运行轨迹。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b7939"/></marker></defs><rect width="1050" height="452" rx="12" fill="#f5f1e6"/><g font-family="PingFang SC,sans-serif" fill="#203e42"><text x="34" y="44" font-family="serif" font-size="25">M05 · 权限与更新驱动的RAG研究</text><text x="34" y="73" font-size="14">按层定位故障；权限、版本、预算与来源沿依赖链传递，不在重试/嵌套时重置。</text><rect x="34" y="100" width="215" height="103" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="50" y="127" font-size="13" fill="#9b7939">层 1</text><text x="141" y="158" text-anchor="middle" font-size="17">原文/权限/版本</text><path d="M252 151h26" fill="none" stroke="#9b7939" stroke-width="2" marker-end="url(#arrow)"/><rect x="282" y="100" width="215" height="103" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="298" y="127" font-size="13" fill="#9b7939">层 2</text><text x="389" y="158" text-anchor="middle" font-size="17">入库与更新</text><path d="M500 151h26" fill="none" stroke="#9b7939" stroke-width="2" marker-end="url(#arrow)"/><rect x="530" y="100" width="215" height="103" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="546" y="127" font-size="13" fill="#9b7939">层 3</text><text x="637" y="158" text-anchor="middle" font-size="17">chunk与索引</text><path d="M748 151h26" fill="none" stroke="#9b7939" stroke-width="2" marker-end="url(#arrow)"/><rect x="778" y="100" width="215" height="103" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="794" y="127" font-size="13" fill="#9b7939">层 4</text><text x="885" y="158" text-anchor="middle" font-size="17">可见候选召回</text><path d="M885 206v37H637v27" fill="none" stroke="#9b7939" stroke-width="2" marker-end="url(#arrow)"/><rect x="530" y="272" width="215" height="103" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="546" y="299" font-size="13" fill="#9b7939">层 5</text><text x="637" y="330" text-anchor="middle" font-size="17">融合/重排</text><path d="M527 323h-26" fill="none" stroke="#9b7939" stroke-width="2" marker-end="url(#arrow)"/><rect x="282" y="272" width="215" height="103" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="298" y="299" font-size="13" fill="#9b7939">层 6</text><text x="389" y="330" text-anchor="middle" font-size="17">证据打包</text><path d="M279 323h-26" fill="none" stroke="#9b7939" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="272" width="215" height="103" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="50" y="299" font-size="13" fill="#9b7939">层 7</text><text x="141" y="330" text-anchor="middle" font-size="17">生成/补证/核对</text><text x="34" y="424" font-size="14">设计层次示意。实际成功/失败/恢复由本章真实请求、事务、状态、输入和测试凭据核对。</text></g></svg>