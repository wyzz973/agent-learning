<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="285" viewBox="0 0 1040 285" role="img"><title>M01-T03 本关概念数据流</title><desc>当前问题与历史 → 区分角色和资料 → 重建当前消息 → 实际模型调用 → 比较输入与出处</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#203e42"/></marker></defs><rect width="1040" height="285" fill="#f5f1e6" rx="10"/><text x="22" y="37" font-family="serif" font-size="23" fill="#203e42">M01-T03 · 沿着一份输入走</text><text x="22" y="62" font-size="13" fill="#526669">概念示意；本次运行是否经过这些步骤，请核对本页实际输入、观察与输出。</text><rect x="22" y="83" width="182" height="120" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="36" y="110" fill="#9b7939" font-size="13">01</text><text x="113" y="143" text-anchor="middle" fill="#203e42" font-size="16">当前问题与历史</text><path d="M205 143h17" stroke="#203e42" stroke-width="2" marker-end="url(#arrow)"/><rect x="224" y="83" width="182" height="120" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="238" y="110" fill="#9b7939" font-size="13">02</text><text x="315" y="143" text-anchor="middle" fill="#203e42" font-size="16">区分角色和资料</text><path d="M407 143h17" stroke="#203e42" stroke-width="2" marker-end="url(#arrow)"/><rect x="426" y="83" width="182" height="120" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="440" y="110" fill="#9b7939" font-size="13">03</text><text x="517" y="143" text-anchor="middle" fill="#203e42" font-size="16">重建当前消息</text><path d="M609 143h17" stroke="#203e42" stroke-width="2" marker-end="url(#arrow)"/><rect x="628" y="83" width="182" height="120" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="642" y="110" fill="#9b7939" font-size="13">04</text><text x="719" y="143" text-anchor="middle" fill="#203e42" font-size="16">实际模型调用</text><path d="M811 143h17" stroke="#203e42" stroke-width="2" marker-end="url(#arrow)"/><rect x="830" y="83" width="182" height="120" rx="8" fill="#fffdf7" stroke="#8c9c92"/><text x="844" y="110" fill="#9b7939" font-size="13">05</text><text x="921" y="143" text-anchor="middle" fill="#203e42" font-size="16">比较输入与出处</text><text x="22" y="274" font-size="12" fill="#526669">每条箭头都需要一次明确的数据传递；界面、资料存在或模型声称完成，都不能替代运行证据。</text></svg>