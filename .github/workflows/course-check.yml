name: Course material contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-and-facilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Install locked learning environment
        run: uv sync --locked
      - name: Course and export contracts
        run: |
          uv run --locked python -m instructor.check
          uv run --locked python -m instructor.check_export_contracts
      - name: Teacher code and facilities
        run: |
          uv run --locked ruff check instructor tests modules --exclude '*.ipynb'
          uv run --locked python -m instructor.lint_notebooks
          uv run --locked mypy
      - name: Deterministic facility tests
        run: uv run --locked pytest -q
